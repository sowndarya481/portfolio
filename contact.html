<section>

    <h2>Send a Message</h2>

    <form>

        <label for="name">Name</label>

        <input
            type="text"
            id="name"
            aria-label="Name"
            required>

        <br><br>

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            aria-label="Email"
            required>

        <br><br>

        <label for="message">Message</label>

        <textarea
            id="message"
            rows="5"
            aria-label="Message"></textarea>

        <br><br>

        <button
            type="submit"
            aria-label="Send Message">
            Send
        </button>

    </form>

</section>
